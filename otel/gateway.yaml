# Central OpenTelemetry Collector ("gateway").
#
# Receives OTLP from the agents and sends each signal to its backend:
# metrics are exposed for Prometheus, traces go to Tempo.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 8192
    timeout: 5s

  # Every resource attribute becomes a Prometheus label. SDK details are the same on
  # every series and only make queries harder to read, so they are dropped for metrics.
  resource/drop-sdk-attributes:
    attributes:
      - key: telemetry.sdk.name
        action: delete
      - key: telemetry.sdk.language
        action: delete
      - key: telemetry.sdk.version
        action: delete
      - key: telemetry.auto.version
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # turns resource attributes such as service.name and host.name into labels
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: ${env:TEMPO_ENDPOINT:-localhost:4317}
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/drop-sdk-attributes, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
